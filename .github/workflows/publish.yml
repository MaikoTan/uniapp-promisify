name: Publish

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Upgrade NPM to Latest
        run: npm install -g npm@latest # >= 11.5.1 required for OIDC trusted publishing

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Publish
        uses: JS-DevTools/npm-publish@v4
