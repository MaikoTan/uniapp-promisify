name: Publish

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # npm 12 requires node ^22.22.2 || ^24.15.0 || >=26, so `npm@latest`
          # cannot be installed on node 20. Staying on the 22.x line keeps this
          # step working as npm keeps releasing new majors.
          node-version: 22

      - name: Upgrade NPM to Latest
        # OIDC trusted publishing requires npm >= 11.5.1. Pinned to the 11.x
        # line rather than `latest`: npm 12 raised its node engine floor to
        # ^22.22.2 || ^24.15.0 || >=26, so an unbounded `latest` breaks the
        # moment a new major ships.
        run: npm install -g 'npm@^11.5.1'

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Publish
        uses: JS-DevTools/npm-publish@v4

      # The action exits 0 when it decides there is nothing to publish, so a green
      # checkmark does not prove the release happened. Without a Trusted Publisher
      # configured on npmjs.com it even misreports unpublished versions as
      # "already published" and skips. Verify against the registry instead of
      # trusting the job status.
      - name: Verify published version
        run: |
          expected=$(node -p "require('./package.json').version")
          published="<none>"
          # The registry can take a moment to reflect a fresh publish, and npm
          # caches metadata, so retry briefly before declaring failure.
          for attempt in 1 2 3 4 5 6; do
            published=$(npm view "${{ github.event.repository.name }}" version --prefer-online 2>/dev/null || echo "<none>")
            echo "attempt $attempt: published=$published"
            [ "$published" = "$expected" ] && break
            sleep 10
          done
          if [ "$published" != "$expected" ]; then
            echo "::error::${{ github.event.repository.name }}@$expected was not published (registry has $published)."
            echo "If npm Trusted Publishing is not configured, set it up on npmjs.com for this package."
            exit 1
          fi
          echo "published ${{ github.event.repository.name }}@$expected"
